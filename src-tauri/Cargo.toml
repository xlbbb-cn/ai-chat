[package]
name = "ai-chat"
version = "1.1.0"
description = "OpenAI-compatible chat client with skills"
authors = []
edition = "2021"

[lib]
name = "rustgui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
os_info = { version ="3.15.0"}
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dirs = "5"
rusqlite = { version = "0.39.0", features = ["bundled"] }
scraper = "0.27.0"
serde_yaml = "0.9"
neo4rs = "0.8.0"
async-trait = "0.1.89"
diffy = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = "0.6"
tiktoken-rs = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

