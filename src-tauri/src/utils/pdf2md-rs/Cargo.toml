[package]
name = "pdf2md-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "PDF (plain text and academic papers) to Markdown: PDFOxide text extraction, page layout analysis, unified IR, Markdown renderer"
license = "GPL-2.0-only"

[lib]
name = "pdf2md_rs"
path = "src/lib.rs"

[dependencies]
# PDF object model, page tree, content-stream operator decoding, font encodings
# (ToUnicode CMaps), stream filters.
lopdf = "0.47"
flate2 = "1"
# Re-encoding Flate/raw image samples into PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
# The IR is the contract with callers (the Tauri layer sends it to the UI as JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional GROBID backend (`--features grobid`).
ureq = { version = "3", default-features = false, features = ["json"], optional = true }
quick-xml = { version = "0.39", optional = true }

[features]
default = []
# `grobid` enables the optional GROBID layout backend for academic papers
# (`Options::layout_backend = LayoutBackend::Grobid`).
grobid = ["dep:ureq", "dep:quick-xml"]
