[package]
name = "pdf2md-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "PDF (plain text and academic papers) to Markdown: PDFOxide text extraction, page layout analysis, unified IR, Markdown renderer"
license = "GPL-2.0-only"

[lib]
name = "pdf2md_rs"
path = "src/lib.rs"

[dependencies]
# PDF object model, page tree, content-stream operator decoding, font encodings
# (ToUnicode CMaps), stream filters.
lopdf = "0.47"
# Byte-encoding tables for fonts that carry no `ToUnicode` CMap: GBK, Big5,
# Shift_JIS, EUC-JP and EUC-KR are the national standards the Adobe predefined
# CMaps were built from, so their tables decode the codes directly.
encoding_rs = "0.8"
flate2 = "1"
# Re-encoding Flate/raw image samples into PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
# The IR is the contract with callers (the Tauri layer sends it to the UI as JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional GROBID backend (`--features grobid`).
ureq = { version = "3", default-features = false, features = ["json"], optional = true }
quick-xml = { version = "0.39", optional = true }

# Batch conversion in parallel (`--features parallel`).
rayon = { version = "1", optional = true }

[features]
default = []
# `grobid` enables the optional GROBID layout backend for academic papers
# (`Options::layout_backend = LayoutBackend::Grobid`).
grobid = ["dep:ureq", "dep:quick-xml"]
# `parallel` converts a batch of files on a worker pool (`batch::convert`).
# Without it the batch module still works — one file at a time.
parallel = ["dep:rayon"]
