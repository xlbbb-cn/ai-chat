# 打 tag（如 v1.1.4）时，为 Linux / macOS / Windows 同时构建安装包，
# 并把产物上传到该 tag 对应的 GitHub Release（直接发布，非草稿）。
#
# 也可手动触发（Actions → Release → Run workflow）：只构建并保留 Actions 产物，不创建 Release。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

run-name: Release ${{ github.ref_name }}

# 同一个 tag 的发布串行执行，避免多个 job 并发写同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 放在 workflow 顶层（而不是 job 内）：实测 tag 触发的运行里，job 内的 permissions
# 会让 GITHUB_TOKEN 拿不到 contents: write，建 Release 直接 403
# "Resource not accessible by integration"。
permissions:
  contents: write # tauri-action 创建 Release / 上传安装包需要
  actions: write # 上传 Actions 产物（uploadWorkflowArtifacts）需要

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false # 某个平台失败不影响其它平台产出
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            slug: macos-aarch64
            rustTargets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            # README 的 releases/latest/download/... 链接依赖这些不带版本号的副本。
            stableAsset: AI-Chat-macOS-Apple-Silicon.dmg
            bundleGlob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS (Intel)
            platform: macos-latest
            slug: macos-x86_64
            rustTargets: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            stableAsset: AI-Chat-macOS-Intel.dmg
            bundleGlob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            slug: linux-x86_64
            rustTargets: ''
            args: ''
            stableAsset: AI-Chat-Linux-x86_64.AppImage
            bundleGlob: src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows (x86_64)
            platform: windows-latest
            slug: windows-x86_64
            rustTargets: ''
            stableAsset: AI-Chat-Windows-x64-setup.exe
            bundleGlob: src-tauri/target/release/bundle/nsis/*-setup.exe
            # 默认同时产出 .msi 与 NSIS -setup.exe；若 Runner 上 MSI（light.exe / VBSCRIPT）不可用，
            # 把 args 改成 '--bundles nsis' 只产出 NSIS 安装包即可。
            args: ''
          # 公开仓库可以再加一条 ARM64 Linux 构建（ubuntu-22.04-arm 目前仅公开仓库可用）：
          # - name: Linux (arm64)
          #   platform: ubuntu-22.04-arm
          #   slug: linux-arm64
          #   rustTargets: ''
          #   args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # build 时执行的 sync-version:git-tag 依赖完整的 tag 列表来推导版本号
          fetch-depth: 0
          fetch-tags: true

      # 版本号来自「最新的 tag」，所以本次发布的 tag 必须就是最新 tag，
      # 否则会在构建过程中被同步成别的版本号，这里直接失败提示。
      - name: Verify tag drives the version
        if: github.event_name == 'push'
        shell: bash
        run: |
          latest="$(git tag --sort=-creatordate | head -n 1)"
          echo "本次 tag: ${GITHUB_REF_NAME}；最新 tag: ${latest}"
          if [ "${latest}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::构建会用最新 tag（${latest}）同步版本号，与本次发布的 ${GITHUB_REF_NAME} 不一致。请先删除更新的 tag，或用最新 tag 重新发布。"
            exit 1
          fi

      # 仓库里的 .cargo/config.toml 把 crates-io 指向 rsproxy.cn（国内加速），
      # GitHub Runner 上没必要走该镜像，删掉以使用官方 crates.io。
      - name: Use official crates.io
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.slug }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # Release 正文由「上一个 tag..本次 tag」的提交生成，省得每次手写更新说明。
      # 四个平台各算一次、内容相同：谁先创建 Release 谁带上，其余平台更新成同一份正文。
      - name: Generate release notes
        if: github.event_name == 'push'
        id: notes
        shell: bash
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" || true)"
          if [ -n "$prev" ]; then
            node scripts/gen-changelog.cjs --from "$prev" --to "$GITHUB_REF_NAME" --format body --output release-notes.md
          else
            printf '## 本次更新\n\n首个版本。\n' > release-notes.md
          fi
          # 多行值必须用定界符写进 $GITHUB_OUTPUT，直接 echo "body=$(...)" 会把换行吃掉。
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # tauri bundler 在打包阶段才现场下载工具链（Linux: AppRun / linuxdeploy，Windows: WiX），
      # 而 GitHub 的 release 下载 CDN 今天多次 503 / 504，一次失败就废掉整个平台。
      # 这里先把它们抓进 bundler 的缓存目录（带长重试），再用 actions/cache 跨运行复用；
      # 预取失败也不致命 —— bundler 自己还会再试一次。
      - name: Cache bundler toolchains
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/AppData/Local/tauri
          key: tauri-bundler-tools-${{ runner.os }}-v1

      - name: Prefetch bundler toolchains
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -uo pipefail
          fetch() {
            out="$1"
            url="$2"
            if [ -s "$out" ]; then
              echo "cache hit: $out"
              return 0
            fi
            echo "download: $url"
            curl -fL --retry 6 --retry-all-errors --retry-delay 6 \
              --connect-timeout 20 --max-time 420 -o "$out.part" "$url" || return 1
            mv "$out.part" "$out"
          }
          base=https://github.com/tauri-apps/binary-releases/releases/download
          if [ "$RUNNER_OS" = "Linux" ]; then
            dir="$HOME/.cache/tauri"
            mkdir -p "$dir"
            fetch "$dir/AppRun-x86_64" "$base/apprun-old/AppRun-x86_64" \
              || echo "::warning::AppRun 预取失败，交由 bundler 重试"
            fetch "$dir/linuxdeploy-x86_64.AppImage" "$base/linuxdeploy/linuxdeploy-x86_64.AppImage" \
              || echo "::warning::linuxdeploy 预取失败，交由 bundler 重试"
            fetch "$dir/linuxdeploy-plugin-gtk.sh" \
              "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" || true
            fetch "$dir/linuxdeploy-plugin-gstreamer.sh" \
              "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh" || true
            chmod +x "$dir/AppRun-x86_64" "$dir/linuxdeploy-x86_64.AppImage" 2>/dev/null || true
          else
            dir="$LOCALAPPDATA/tauri"
            mkdir -p "$dir"
            if fetch "$dir/wix314-binaries.zip" \
              "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"; then
              mkdir -p "$dir/WixTools314"
              unzip -qo "$dir/wix314-binaries.zip" -d "$dir/WixTools314"
              echo "WiX 已解压到 $dir/WixTools314"
            else
              echo "::warning::WiX 预取失败，交由 bundler 重试"
            fi
          fi

      # tauri build 会走 tauri.conf.json 的 beforeBuildCommand（npm run build），
      # 其中 sync-version:git-tag 把 package.json / Cargo.toml / tauri.conf.json 的版本对齐到 tag。
      # 打包阶段 tauri bundler 还要现场下载工具链（Linux: AppRun / linuxdeploy，Windows: WiX），
      # GitHub 的 release 下载 CDN 偶发 503 / 504，一次抖动就会毁掉整个平台的产出。
      # 所以构建给两次机会：首次失败不中断 job，交给下面的 retry 步骤；此时 rust cache 已热，
      # 重试一般 1~2 分钟就能重新走到打包，足以兜住工具链下载的瞬时故障。
      - name: Build installers
        id: build1
        uses: tauri-apps/tauri-action@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 暂无 Apple 证书时用 ad-hoc 签名，避免 Apple Silicon 上提示「应用已损坏」。
          # 之后接入真实证书时，改为在 secrets 里提供 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
          # （公证再加 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID），并删掉这一行。
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          # 只有 tag 触发的运行才创建 / 更新 Release；手动触发只产出 Actions 产物
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && 'AI Chat v__VERSION__' || '' }}
          releaseBody: |
            `AI Chat v__VERSION__` 由 GitHub Actions 自动构建。

            ${{ steps.notes.outputs.body }}

            ### 安装包

            - Windows：`.msi` / `-setup.exe`
            - macOS：`.dmg`（Apple Silicon `aarch64` / Intel `x86_64`）
            - Linux：`.AppImage` / `.deb` / `.rpm`

            首次打开若被系统拦截：Windows 选「仍要运行」；macOS 在「系统设置 → 隐私与安全性」中
            选择「仍要打开」，或右键 App → 打开。
          # 直接发布 Release（非草稿），winget 等下游才能公开下载安装包。
          # 注意：Release 在首个平台构建完成时就创建，其余平台的 assets 会随后陆续上传，
          # 下游消费（如 winget 提交）需等待对应的 NSIS 安装包真正上传完成。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false # 未配置 updater，无需生成 latest.json
          uploadWorkflowArtifacts: true # 同时保留 Actions 运行产物，未发布也能下载
          args: ${{ matrix.args }}

      # 仅当上一次构建失败时执行（绝大多数情况就是上面那类工具链下载 503 / 504）。
      # 两次都失败才算这个平台构建失败，避免一次网络抖动就要人工重跑整个发布。
      - name: Cool down before retry
        if: steps.build1.outcome == 'failure'
        shell: bash
        run: |
          echo "首次构建失败，等 90 秒再重试，让 CDN 的瞬时故障有时间过去。"
          sleep 90

      - name: Build installers (retry)
        if: steps.build1.outcome == 'failure'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && 'AI Chat v__VERSION__' || '' }}
          releaseBody: |
            `AI Chat v__VERSION__` 由 GitHub Actions 自动构建。

            ${{ steps.notes.outputs.body }}

            ### 安装包

            - Windows：`.msi` / `-setup.exe`
            - macOS：`.dmg`（Apple Silicon `aarch64` / Intel `x86_64`）
            - Linux：`.AppImage` / `.deb` / `.rpm`

            首次打开若被系统拦截：Windows 选「仍要运行」；macOS 在「系统设置 → 隐私与安全性」中
            选择「仍要打开」，或右键 App → 打开。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          # 首次尝试可能已经把同名产物传上去了，重试再传会 409 Conflict，这里关掉：
          # 产物留在首次的那份里，重试只负责把构建和 Release 补齐。
          uploadWorkflowArtifacts: false
          args: ${{ matrix.args }}

      # GitHub 的 releases/latest/download/<name> 要求文件名的版本号固定，而 Tauri 的
      # 产物名带 <version>。这里额外上传一份不带版本号的副本，README 的三平台按钮
      # 才能一直指向最新版（手动触发只构建，不碰 Release）。
      - name: Upload stable-named asset
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          src="$(ls ${{ matrix.bundleGlob }} | head -n 1)"
          dest="$(dirname "$src")/${{ matrix.stableAsset }}"
          cp "$src" "$dest"
          gh release upload "${GITHUB_REF_NAME}" "$dest" --clobber
          echo "Uploaded ${{ matrix.stableAsset }} from $src"
