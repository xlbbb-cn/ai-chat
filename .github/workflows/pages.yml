# 把 docs/site/ 发布到 GitHub Pages（纯静态，无构建步骤）。
#
# 仓库设置里需要一次性打开：Settings → Pages → Build and deployment → Source: GitHub Actions。
# 站点地址：https://xlbbb-cn.github.io/ai-chat/
#
# 架构图由 docs/gen.py 生成，部署前在 CI 里跑一次（gen.py 直接写
# docs/site/architecture.html），保持单一来源（不要在 docs/site/ 里提交副本，见 .gitignore）。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/gen.py'
      - 'docs/wiki/**'
      - 'scripts/gen-wiki.mjs'
      - '.github/workflows/pages.yml'
  # 每周一重建一次 model_metadata.json（连同整站重新部署）：该文件由
  # model-catalog crate 在部署时生成（三个公开目录合并为一个），应用直接从
  # Pages 拉取，所以目录的更新节奏由这个定时器决定。
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署；不打断正在进行的发布。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库里的 .cargo/config.toml 把 crates-io 指向 rsproxy.cn（国内加速），
      # runner 上不可达，先移除（同 release.yml）。
      - name: Remove the cargo mirror config
        run: rm -f .cargo/config.toml

      # model_metadata.json 由 model-catalog crate 在这里生成（三个公开目录
      # 合并成一个文件，构建失败或产出不合格时该步骤失败，部署中止），应用
      # 直接从 Pages 拉取。只编译这一个 crate，不需要 WebKit 等系统依赖；
      # reqwest 的 native-tls 需要 OpenSSL 头文件（同 release.yml）。
      - name: Install OpenSSL dev headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate model metadata catalogue
        working-directory: src-tauri
        run: cargo run -p model-catalog --bin build-catalog -- ../docs/site/model_metadata.json

      - name: Generate architecture page
        run: python3 docs/gen.py

      # 文档页由 docs/wiki/ 的 markdown 生成；CI 里只装 markdown-it
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the wiki generator dependency
        run: npm ci --omit=dev --ignore-scripts

      - name: Generate wiki pages
        run: node scripts/gen-wiki.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4