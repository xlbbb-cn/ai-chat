# 把 docs/site/ 发布到 GitHub Pages（纯静态，无构建步骤）。
#
# 仓库设置里需要一次性打开：Settings → Pages → Build and deployment → Source: GitHub Actions。
# 站点地址：https://xlbbb-cn.github.io/ai-chat/
#
# 架构图由 docs/gen.py 生成，部署前在 CI 里跑一次（gen.py 直接写
# docs/site/architecture.html），保持单一来源（不要在 docs/site/ 里提交副本，见 .gitignore）。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/gen.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署；不打断正在进行的发布。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate architecture page
        run: python3 docs/gen.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4