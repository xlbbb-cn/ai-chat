<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 — Rabbit Chat Studio</title>
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:light;--bg:#FFFFFF;--text:#171A20;--body:#393C41;--muted:#5C5E62;
    --border:#EEEEEE;--accent:#3E6AE1;--on-accent:#FFFFFF;
    --font:"RazerF5",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Microsoft YaHei","PingFang SC",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#171A20;--text:#F4F4F4;--body:#D0D1D2;
    --muted:#8E8E93;--border:rgba(255,255,255,.08);--accent:#5B7EF0}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--bg);color:var(--body);
    font-family:var(--font);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  main{max-width:520px;border-top:1px solid var(--border);padding-top:24px}
  p.code{font-family:var(--mono);font-size:11px;color:var(--muted)}
  h1{margin:10px 0 12px;font-size:26px;font-weight:500;line-height:1.3;color:var(--text);letter-spacing:-.01em}
  p{color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  a{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:4px;font-size:14px;
    text-decoration:none;border:1px solid transparent;transition:background-color .18s,border-color .18s,color .18s}
  a.primary{background:var(--accent);color:var(--on-accent)}
  a.secondary{background:var(--bg);color:var(--body);border-color:var(--border)}
  a.secondary:hover{border-color:var(--muted);color:var(--text)}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>这个地址没有内容</h1>
  <p>可能是链接过期，或者路径拼错了。回到首页继续。</p>
  <div class="row">
    <a class="primary" href="/ai-chat/">回到首页</a>
    <a class="secondary" href="https://github.com/xlbbb-cn/ai-chat">GitHub 仓库</a>
  </div>
</main>
</body>
</html>
