<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rabbit Chat Studio</title>
  <script>
    // First-paint theme: applied before any stylesheet is parsed, so a dark
    // launch never paints the light default for a frame. `applyTheme()` in
    // src/App.tsx keeps the `ai-chat.theme` cache fresh; with no cache the OS
    // colour-scheme is honoured, exactly like the `auto` config value. The
    // real config still arrives over IPC and wins.
    try {
      var cached = JSON.parse(localStorage.getItem("ai-chat.theme") || "{}");
      var dark =
        cached.mode === "dark" ||
        (cached.mode !== "light" &&
          matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      // A cache written before the Sakura palette was removed still names it;
      // an unknown value must never select a token block that no longer exists.
      document.documentElement.setAttribute(
        "data-palette",
        cached.palette === "cream" || cached.palette === "macaron"
          ? cached.palette
          : "default"
      );
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
